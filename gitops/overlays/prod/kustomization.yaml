apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base
# CI (build-push-ecr.yml) automatically updates newName and digest after pushing an image:
# - selfTest: commit directly to selfTest (so Argo detects it immediately)
# - main/master: open a PR for review and merge
images:
  - name: demo/app
    newName: "483510445378.dkr.ecr.ap-southeast-1.amazonaws.com/app-demo"
    digest: sha256:3e7ced715a10311c8bf10f28613666ab410bb452ab96a60ad99634ac05d8586b
