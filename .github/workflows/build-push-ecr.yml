# 本文件用于放在「业务仓库」中，例如 GitHub 上的 jpos-template-card。
# 勿放在仅部署 CDK 的仓库里（除非该仓库也要构建镜像）。
#
# 使用步骤：
# 1) 将本文件复制到 jpos-template-card 仓库：.github/workflows/build-push-ecr.yml
# 2) AWS CDK 部署时 githubImageRepo（或 githubRepo）必须与 jpos-template-card 一致，否则 OIDC 无法 AssumeRole
# 3) 在 jpos-template-card 配置 Secrets / Variables（见 infra 仓库 docs/OPERATIONS.md）
#
# OIDC 信任：repo:ORG/jpos-template-card:ref:*（默认）或 CDK 中 githubRefExact 收紧
# Secrets: AWS_ROLE_TO_ASSUME (repository secret)
# Variables: AWS_REGION, ECR_REPOSITORY_NAME (repository variables — not environment-only unless you add `environment:` to the job)
name: Build and push image to ECR

on:
  push:
    branches:
      - main
      - master
      - selfTest # 仅推 :latest（不推 sha 标签，见下方 run 脚本）
    tags:
      - 'v*'
    paths-ignore:
      - 'gitops/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # 可选：在官方把 Node 24 设为默认前，减少 Node 20 弃用噪音（与升级后的 action 二选一即可）
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # v6+ 使用较新 Node，避免 “Node.js 20 actions are deprecated” 针对 checkout 的告警
      - uses: actions/checkout@v6

      - name: Check required repository variables
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::在仓库 Settings → Variables 中设置 AWS_REGION（与 ECR/EKS 区域一致）"
            exit 1
          fi
          if [ -z "${{ vars.ECR_REPOSITORY_NAME }}" ]; then
            echo "::error::在仓库 Settings → Variables 中设置 ECR_REPOSITORY_NAME（与 CDK EcrStack 输出一致）"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.1

      - name: Build and push (branch/tag aliases)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          test -n "${REPOSITORY:-}" || { echo "Set Actions variable ECR_REPOSITORY_NAME"; exit 1; }
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          GREF="${{ github.ref }}"
          SHA_TAG="${{ github.sha }}"
          DIGEST_TAG="$SHA_TAG"

          if [ "$GREF" = "refs/heads/selfTest" ]; then
            docker build -t "$REGISTRY/$REPOSITORY:latest" .
            docker push "$REGISTRY/$REPOSITORY:latest"
            echo "Pushed :latest only for selfTest"
            DIGEST_TAG="latest"
          else
            docker build -t "$REGISTRY/$REPOSITORY:$SHA_TAG" .
            docker push "$REGISTRY/$REPOSITORY:$SHA_TAG"
          fi

          if [ "$REF_TYPE" = "branch" ] && { [ "$GREF" = "refs/heads/main" ] || [ "$GREF" = "refs/heads/master" ]; }; then
            docker tag "$REGISTRY/$REPOSITORY:$SHA_TAG" "$REGISTRY/$REPOSITORY:latest"
            docker push "$REGISTRY/$REPOSITORY:latest"
            echo "Also pushed :latest"
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            docker tag "$REGISTRY/$REPOSITORY:$SHA_TAG" "$REGISTRY/$REPOSITORY:$REF_NAME"
            docker push "$REGISTRY/$REPOSITORY:$REF_NAME"
            echo "Also pushed :$REF_NAME"
          fi

          # 需要 IAM ecr:DescribeImages（CDK GitHubOidcStack 推送角色已包含；勿删权限与脚本不同步）
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$DIGEST_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_NEW_NAME=$REGISTRY/$REPOSITORY" >> "$GITHUB_ENV"
          echo "Pushed $REGISTRY/$REPOSITORY@$DIGEST"

      - name: Summary
        run: |
          echo "### Image (digest)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Propose GitOps digest update (PR)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          IMAGE_NEW_NAME: ${{ env.IMAGE_NEW_NAME }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/gitops-bump-digest.py ]; then
            echo "No scripts/gitops-bump-digest.py — skip PR"
            exit 0
          fi
          python3 scripts/gitops-bump-digest.py
          if git diff --quiet; then
            echo "GitOps overlay already matches digest; nothing to PR"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ci/gitops-digest-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add gitops/overlays/prod/kustomization.yaml
          git commit -m "chore(gitops): bump image digest [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(gitops): bump image digest" \
            --body "Automated after image push to \`${IMAGE_NEW_NAME}@${IMAGE_DIGEST}\` on branch \`${GITHUB_REF_NAME}\`."
