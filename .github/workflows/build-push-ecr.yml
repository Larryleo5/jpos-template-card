# This file is intended for the business repository (for example, jpos-template-card on GitHub).
# Do not place it in a CDK-only repository (unless that repo also builds images).
#
# Usage:
# 1) Copy this file into the jpos-template-card repository: .github/workflows/build-push-ecr.yml
# 2) During AWS CDK deployment, githubImageRepo (or githubRepo) must match jpos-template-card, otherwise OIDC assume-role will fail
# 3) Configure Secrets / Variables in jpos-template-card (see infra repo docs/OPERATIONS.md)
#
# OIDC trust: repo:ORG/jpos-template-card:ref:* (default), or tighten with githubRefExact in CDK
# Secrets: AWS_ROLE_TO_ASSUME (repository secret)
# Variables: AWS_REGION, ECR_REPOSITORY_NAME (required)
# APC runtime config is now synced by External Secrets from AWS Secrets Manager.
# Business workflow no longer calls kubectl apply for apc-config.
name: Build and push image to ECR

on:
  push:
    branches:
      - main
      - master
      - selfTest # Push :latest only (no SHA tag), see run script below
    tags:
      - 'v*'
    paths-ignore:
      - 'gitops/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Optional: before Node 24 becomes the default, reduce Node 20 deprecation noise (either this or upgraded actions)
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # v6+ uses newer Node runtime to avoid "Node.js 20 actions are deprecated" warnings for checkout
      - uses: actions/checkout@v6

      - name: Check required repository variables
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::Set AWS_REGION in repository Settings → Variables (must match your ECR/EKS region)"
            exit 1
          fi
          if [ -z "${{ vars.ECR_REPOSITORY_NAME }}" ]; then
            echo "::error::Set ECR_REPOSITORY_NAME in repository Settings → Variables (must match CDK EcrStack output)"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.1

      - name: Build and push (branch/tag aliases)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          test -n "${REPOSITORY:-}" || { echo "Set Actions variable ECR_REPOSITORY_NAME"; exit 1; }
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          GREF="${{ github.ref }}"
          SHA_TAG="${{ github.sha }}"
          DIGEST_TAG="$SHA_TAG"

          if [ "$GREF" = "refs/heads/selfTest" ]; then
            docker build -t "$REGISTRY/$REPOSITORY:latest" .
            docker push "$REGISTRY/$REPOSITORY:latest"
            echo "Pushed :latest only for selfTest"
            DIGEST_TAG="latest"
          else
            docker build -t "$REGISTRY/$REPOSITORY:$SHA_TAG" .
            docker push "$REGISTRY/$REPOSITORY:$SHA_TAG"
          fi

          if [ "$REF_TYPE" = "branch" ] && { [ "$GREF" = "refs/heads/main" ] || [ "$GREF" = "refs/heads/master" ]; }; then
            docker tag "$REGISTRY/$REPOSITORY:$SHA_TAG" "$REGISTRY/$REPOSITORY:latest"
            docker push "$REGISTRY/$REPOSITORY:latest"
            echo "Also pushed :latest"
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            docker tag "$REGISTRY/$REPOSITORY:$SHA_TAG" "$REGISTRY/$REPOSITORY:$REF_NAME"
            docker push "$REGISTRY/$REPOSITORY:$REF_NAME"
            echo "Also pushed :$REF_NAME"
          fi

          # Requires IAM ecr:DescribeImages (already included in CDK GitHubOidcStack push role; keep policy and script in sync)
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$DIGEST_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_NEW_NAME=$REGISTRY/$REPOSITORY" >> "$GITHUB_ENV"
          echo "Pushed $REGISTRY/$REPOSITORY@$DIGEST"

      - name: Summary
        run: |
          echo "### Image (digest)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Update GitOps digest (selfTest direct push / main-master PR)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ env.IMAGE_DIGEST }}
          IMAGE_NEW_NAME: ${{ env.IMAGE_NEW_NAME }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/gitops-bump-digest.py ]; then
            echo "No scripts/gitops-bump-digest.py — skip digest update"
            exit 0
          fi

          # 1) Update manifest with real image digest.
          python3 scripts/gitops-bump-digest.py
          if git diff --quiet; then
            echo "GitOps overlay already matches digest; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/overlays/prod/kustomization.yaml
          if [ "${GITHUB_REF_NAME}" = "selfTest" ]; then
            # Argo tracks selfTest by default: commit directly so sync can pick up immediately.
            git commit -m "chore(gitops): bump image digest [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Directly pushed digest update to ${GITHUB_REF_NAME}"
            exit 0
          fi

          # main/master: keep PR review flow.
          BRANCH="ci/gitops-digest-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore(gitops): bump image digest [skip ci]"
          git push -u origin "$BRANCH"
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh CLI not found on runner, cannot create PR"
            exit 1
          fi
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(gitops): bump image digest" \
            --body "Automated after image push to \`${IMAGE_NEW_NAME}@${IMAGE_DIGEST}\` on branch \`${GITHUB_REF_NAME}\`."
